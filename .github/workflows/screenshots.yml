name: build-and-screenshots
on:
  push:
  workflow_dispatch:
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
      - run: node scripts/screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
          retention-days: 7
