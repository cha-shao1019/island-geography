name: build-and-screenshots
on:
  push:
    branches-ignore: [ci-shots]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
      - run: node scripts/screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
          retention-days: 7
      - name: Publish screenshots to ci-shots branch
        if: always()
        run: |
          cd shots
          git init -q -b ci-shots
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          echo "commit ${GITHUB_SHA}" > SOURCE.txt
          git add -A && git commit -qm "screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots
